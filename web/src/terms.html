<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="terms.title">&#8203;</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/legal.css" />
  </head>

  <body>
    <main class="legal">
      <h1 data-i18n="terms.heading"></h1>

      <div class="line"></div>

      <section id="purpose">
        <h2><a href="#purpose" data-i18n="terms.purpose.title"></a></h2>
        <p data-i18n="terms.purpose.description"></p>
      </section>

      <div class="line"></div>

      <section id="profile">
        <h2><a href="#profile" data-i18n="terms.profile.title"></a></h2>
        <ol>
          <li data-i18n="terms.profile.description.first"></li>
          <li data-i18n="terms.profile.description.second"></li>
          <li data-i18n="terms.profile.description.initial"></li>
          <li data-i18n="terms.profile.description.third"></li>
          <li data-i18n="terms.profile.description.fourth"></li>
        </ol>
      </section>

      <div class="line"></div>

      <section id="service">
        <h2><a href="#service" data-i18n="terms.service.title"></a></h2>
        <ol>
          <li data-i18n="terms.service.description.first"></li>
          <li data-i18n="terms.service.description.second"></li>
          <li data-i18n="terms.service.description.room"></li>
          <li data-i18n="terms.service.description.guest"></li>
          <li data-i18n="terms.service.description.third"></li>
          <li data-i18n="terms.service.description.fourth"></li>
          <li data-i18n="terms.service.description.notice"></li>
        </ol>
      </section>

      <div class="line"></div>

      <section id="conduct">
        <h2><a href="#conduct" data-i18n="terms.conduct.title"></a></h2>
        <p data-i18n="terms.conduct.description.first"></p>
        <p data-i18n="terms.conduct.description.second"></p>
        <ul>
          <li data-i18n="terms.conduct.description.abuse"></li>
          <li data-i18n="terms.conduct.description.illegal"></li>
          <li data-i18n="terms.conduct.description.privacy"></li>
          <li data-i18n="terms.conduct.description.rights"></li>
          <li data-i18n="terms.conduct.description.spam"></li>
          <li data-i18n="terms.conduct.description.disruption"></li>
          <li data-i18n="terms.conduct.description.misuse"></li>
        </ul>
        <p data-i18n="terms.conduct.description.fourth"></p>
      </section>

      <div class="line"></div>

      <section id="content">
        <h2><a href="#content" data-i18n="terms.content.title"></a></h2>
        <ol>
          <li data-i18n="terms.content.description.first"></li>
          <li data-i18n="terms.content.description.second"></li>
          <li data-i18n="terms.content.description.third"></li>
          <li data-i18n="terms.content.description.fourth"></li>
          <li data-i18n="terms.content.description.retention"></li>
          <li data-i18n="terms.content.description.fifth"></li>
        </ol>
      </section>

      <div class="line"></div>

      <section id="notification">
        <h2>
          <a href="#notification" data-i18n="terms.notification.title"></a>
        </h2>
        <ol>
          <li data-i18n="terms.notification.description.first"></li>
          <li data-i18n="terms.notification.description.second"></li>
          <li data-i18n="terms.notification.description.third"></li>
          <li data-i18n="terms.notification.description.preview"></li>
          <li data-i18n="terms.notification.description.delivery"></li>
        </ol>
      </section>

      <div class="line"></div>

      <section id="restriction">
        <h2>
          <a href="#restriction" data-i18n="terms.restriction.title"></a>
        </h2>
        <ol>
          <li data-i18n="terms.restriction.description.first"></li>
          <li data-i18n="terms.restriction.description.second"></li>
          <li data-i18n="terms.restriction.description.third"></li>
        </ol>
      </section>

      <div class="line"></div>

      <section id="contact">
        <h2><a href="#contact" data-i18n="terms.contact.title"></a></h2>
        <p data-i18n="terms.contact.description.first"></p>

        <div class="legal-contact">
          <button
            type="button"
            data-contact="contact"
            data-circle
            data-icon="chat"
            data-tooltip="menu.contact"
            data-response
          ></button>
          <button
            type="button"
            data-contact="mail"
            data-circle
            data-icon="mail"
            data-tooltip="profile.email"
            data-response
          ></button>
          <button
            type="button"
            data-contact="discord"
            data-circle
            data-icon="discord"
            data-tooltip="legal.discord"
            data-response
          ></button>
        </div>
      </section>

      <div class="line"></div>

      <section id="effective">
        <h2>
          <a href="#effective" data-i18n="terms.effective.title"></a>
        </h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col" data-i18n="legal.version"></th>
                <th scope="col" data-i18n="legal.announced"></th>
                <th scope="col" data-i18n="legal.effective"></th>
                <th scope="col" data-i18n="legal.summary"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row" data-i18n="legal.revision"></th>
                <td data-i18n="legal.date"></td>
                <td data-i18n="legal.date"></td>
                <td data-i18n="terms.effective.summary"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div>
      <script type="module" src="/src/js/legal.js"></script>
    </div>
  </body>
</html>
