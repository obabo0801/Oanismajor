user www-data;
worker_processes auto;
worker_shutdown_timeout 5s;
pid /run/oanismajor-__PORT__.pid;
error_log stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    map "$request_method:$http_sec_fetch_dest:$http_accept" $oanismajor_document {
        default 0;
        "~^GET:(document:|[^:]*:.*text/html)" 1;
    }
    map $http_x_forwarded_for $oanismajor_address {
        "" $remote_addr;
        default $http_x_forwarded_for;
    }
    map $http_x_forwarded_proto $oanismajor_scheme {
        default $scheme;
        https https;
    }
    upstream was {
        least_conn;
__UPSTREAM__
        keepalive 16;
    }
    server {
        listen __ADDRESS__:__PORT__;
        listen 127.0.0.1:__PORT__;
        server_name _;
        root __ROOT__/web/dist;
        server_tokens off;
        client_max_body_size 500m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $oanismajor_address;
        proxy_set_header X-Forwarded-Proto $oanismajor_scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        location = /_health { proxy_pass http://was; }
        location = /_ready {
            proxy_pass http://was/_health;
            proxy_hide_header X-oanismajor-Server;
            add_header Cache-Control "no-store" always;
        }
        location /assets/ {
            error_page 418 = @was;
            if ($oanismajor_document) { return 418; }
            if ($request_method !~ ^(GET|HEAD)$) { return 418; }
            try_files $uri @was;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
        }
        location @was {
            proxy_pass http://was;
            proxy_next_upstream error timeout http_404;
        }
        location / { proxy_pass http://was; }
    }
}
