load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;
user www-data;
worker_processes auto;
worker_shutdown_timeout 5s;
pid /run/oanismajor-https.pid;
error_log stderr notice;

events { worker_connections 2048; }
http {
    access_log off;
    resolver 1.1.1.1 8.8.8.8 ipv6=off;
    acme_shared_zone zone=acme:1M;
    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        contact __EMAIL__;
        profile shortlived require;
        challenge http-01;
        state_path /var/lib/oanismajor/acme;
        accept_terms_of_service;
    }
    upstream web {
        least_conn;
__UPSTREAM__
        keepalive 16;
    }
    server {
        listen 80;
        server_name __HOST__;
        location = /_health {
            allow 127.0.0.1;
            deny all;
            return 204;
        }
        location / { return 308 https://__HOST__$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name __HOST__;
        server_tokens off;
        acme_certificate letsencrypt __HOST__;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        ssl_certificate_cache max=2;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 500m;
        location = /_health { return 404; }
        location = /_ready {
            proxy_pass http://web/_ready;
            proxy_hide_header X-oanismajor-Server;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            add_header Cache-Control "no-store" always;
        }
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_timeout 2s;
        }
    }
}
